  <script>
    // Network Animation
    const canvas = document.getElementById('networkCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1.5;
        this.speedX = Math.random() * 0.8 - 0.4;
        this.speedY = Math.random() * 0.8 - 0.4;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
      }
      draw() {
        ctx.shadowBlur = 25;
        ctx.shadowColor = '#4ade80';
        ctx.fillStyle = '#86efac';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function connectParticles() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < 115) {
            ctx.strokeStyle = `rgba(134, 239, 172, ${0.5 - distance / 115})`;
            ctx.lineWidth = 0.7;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      ctx.fillStyle = 'rgba(5, 5, 5, 0.15)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      connectParticles();
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    for (let i = 0; i < 80; i++) particles.push(new Particle());
    animate();

      {name:"Blockie NFT", desc:"AI-Native generative NFT collection on Ritual Chain. Mint unique Blockie NFTs verified by Infernet oracle.", category:"NFT", image:"https://raw.githubusercontent.com/nostalgiagila/Ritual-App-Hub/main/images/Screenshot_57.png", link:"https://ritual-testnet-six.vercel.app/"},

      // Project Ini (Belum Masuk List)
      {name:"Ritual App Hub", desc:"List of applications built by the Ritual community.", category:"Hub", image:"https://raw.githubusercontent.com/nostalgiagila/Ritual-App-Hub/main/images/Screenshot_32.png", link:"https://ritualapp-hub.vercel.app"}
    ];

    const grid = document.getElementById('project-grid');

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function renderProjects(filteredProjects) {
      grid.innerHTML = '';
      filteredProjects.forEach(p => {
        const cardHTML = `
          <div class="project-card bg-zinc-950 border border-zinc-800 rounded-3xl overflow-hidden group">
            <img src="${p.image}" alt="${p.name}">
            <div class="p-5 flex-1 flex flex-col">
              <h3 class="text-lg font-semibold mb-2">${p.name}</h3>
              <p class="text-zinc-400 text-sm leading-tight mb-4 flex-1">${p.desc}</p>
              <span class="inline-block px-3 py-1 text-xs bg-emerald-900 text-emerald-400 rounded-full mb-4">${p.category}</span>
              <a href="${p.link}" target="_blank" class="mt-auto block w-full py-3 text-center border border-emerald-500 hover:bg-emerald-500 hover:text-black rounded-2xl text-sm font-medium transition">
                Launch Project →
              </a>
            </div>
          </div>
        `;
        grid.innerHTML += cardHTML;
      });
    }

    renderProjects(shuffleArray([...projects]));

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      if (term === '') {
        renderProjects(shuffleArray([...projects]));
        return;
      }
      const filtered = projects.filter(p => 
        p.name.toLowerCase().includes(term) ||
        p.desc.toLowerCase().includes(term) ||
        p.category.toLowerCase().includes(term)
      );
      renderProjects(filtered);
    });

    const scrollContainer = document.getElementById('project-grid');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    prevBtn.addEventListener('click', () => scrollContainer.scrollBy({ left: -840, behavior: 'smooth' }));
    nextBtn.addEventListener('click', () => scrollContainer.scrollBy({ left: 840, behavior: 'smooth' }));

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') prevBtn.click();
      if (e.key === 'ArrowRight') nextBtn.click();
    });
  </script>
</body>
</html>
