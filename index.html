<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ritual App Hub</title>
  
  <!-- Favicon / Icon Tab -->
  <link rel="icon" type="image/png" href="ritual-tab-icon.png">
  <link rel="apple-touch-icon" href="ritual-tab-icon.png">

  <link rel="icon" type="image/png" sizes="16x16" href="ritual-tab-icon.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { 
      background-color: #050505; 
      font-family: system-ui; 
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main { flex: 1; display: flex; align-items: center; justify-content: center; }
    canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.18; }

    .main-content { width: 100%; max-width: 1200px; padding: 0 20px; }

    .projects-wrapper {
      overflow: visible;
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
    }
    .projects-scroll {
      display: flex;
      gap: 24px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    .projects-scroll::-webkit-scrollbar { display: none; }

    .project-card {
      flex: 0 0 calc(33.333% - 16px);
      scroll-snap-align: start;
      min-height: 355px;
      background: #0a0a0a;
      border: 1px solid #27272a;
      border-radius: 20px;
      overflow: hidden;
      transition: all 0.4s ease;
      display: flex;
      flex-direction: column;
    }
    .project-card:hover {
      transform: scale(1.04);
      border-color: #22c55e;
    }
    .project-card img {
      height: 160px;
      object-fit: cover;
      width: 100%;
    }

    .nav-btn {
      width: 62px;
      height: 62px;
      background: linear-gradient(to right, #22c55e, #4ade80);
      color: black;
      font-size: 34px;
      border-radius: 9999px;
      transition: all 0.3s ease;
    }
    .nav-btn:hover {
      transform: scale(1.15);
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.8);
    }
    .btn-pos-left { left: -80px; }
    .btn-pos-right { right: -80px; }

    @media (max-width: 1350px) {
      .btn-pos-left { left: -40px; }
      .btn-pos-right { right: -40px; }
    }
    @media (max-width: 768px) {
      .btn-pos-left { left: -20px; }
      .btn-pos-right { right: -20px; }
      .nav-btn { width: 45px; height: 45px; font-size: 24px; }
    }
  </style>
</head>
<body class="text-white">

            <p class="text-base md:text-lg text-zinc-400">List of applications built by the Ritual community</p>

        </div>
        <a href="https://faucet.ritualfoundation.org/" target="_blank"

          <i class="fas fa-faucet"></i> Request Testnet Tokens

      </div>

      <!-- Search -->

        </div>

      <!-- Carousel -->

        <button id="prevBtn" class="nav-btn absolute btn-pos-left top-1/2 -translate-y-1/2 z-30">‹</button>
        <div id="project-grid" class="projects-scroll flex gap-6 overflow-x-auto pb-8"></div>
        <button id="nextBtn" class="nav-btn absolute btn-pos-right top-1/2 -translate-y-1/2 z-30">›</button>
      </div>
    </div>
  </main>

  <!-- Fixed Footer -->

  <script>
    // Network Animation - Hanya Dot yang Menyala
    const canvas = document.getElementById('networkCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 3 + 1.5;
        this.speedX = Math.random() * 0.8 - 0.4;
        this.speedY = Math.random() * 0.8 - 0.4;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
      }
      draw() {
        ctx.shadowBlur = 25;
        ctx.shadowColor = '#4ade80';
        ctx.fillStyle = '#86efac';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function connectParticles() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < 115) {
            ctx.strokeStyle = `rgba(134, 239, 172, ${0.5 - distance / 115})`;
            ctx.lineWidth = 0.7;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      ctx.fillStyle = 'rgba(5, 5, 5, 0.15)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      connectParticles();
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    for (let i = 0; i < 80; i++) particles.push(new Particle());
    animate();

    // 33 Projects

      {name:"Rekt or Rich", desc:"Fun prediction game on Ritual.", category:"Prediction", image:"https://raw.githubusercontent.com/nostalgiagila/ritual-testnet-hub/main/images/Screenshot_21.png", link:"https://ramavenom.github.io/rekt-or-rich/"},
      {name:"Ritual Memory Vault", desc:"Secure memory and data vault.", category:"Tool", image:"https://raw.githubusercontent.com/nostalgiagila/ritual-testnet-hub/main/images/Screenshot_22.png", link:"https://ritual-memory-vault.replit.app/"},

      {name:"Ritual Score Checker", desc:"Check your on-chain activity score.", category:"Tool", image:"https://raw.githubusercontent.com/nostalgiagila/ritual-testnet-hub/main/images/Screenshot_25.png", link:"https://ritual-score-checker--0xrumora.replit.app/"},
      {name:"Ritual Faucet", desc:"Community faucet for testnet tokens.", category:"Tool", image:"https://raw.githubusercontent.com/nostalgiagila/ritual-testnet-hub/main/images/Screenshot_26.png", link:"https://ritual-faucet-blueprint--ritualcommunity.replit.app/"},
      {name:"Siggy Power Cards", desc:"Collectible power cards game.", category:"GameFi", image:"https://raw.githubusercontent.com/nostalgiagila/ritual-testnet-hub/main/images/Screenshot_27.png", link:"https://siggy-power-cards.vercel.app/"},
      {name:"Ritual Casino Quest", desc:"Quest-based casino experience.", category:"GameFi", image:"https://raw.githubusercontent.com/nostalgiagila/ritual-testnet-hub/main/images/Screenshot_28.png", link:"https://ritual-casino-quest.lovable.app/"},
      {name:"Ritual Oracle", desc:"Advanced oracle service.", category:"Infrastructure", image:"https://raw.githubusercontent.com/nostalgiagila/ritual-testnet-hub/main/images/Screenshot_29.png", link:"https://ritual-oracle-two.vercel.app/"},
      {name:"Ritual Bubble Shooter", desc:"Classic bubble shooter game.", category:"GameFi", image:"https://raw.githubusercontent.com/nostalgiagila/ritual-testnet-hub/main/images/Screenshot_30.png", link:"https://ritual-bubble-shooter-jt.lovable.app/"},
      {name:"Siggy Pixelverse", desc:"Pixel art universe by Siggy.", category:"GameFi", image:"https://raw.githubusercontent.com/nostalgiagila/ritual-testnet-hub/main/images/Screenshot_31.png", link:"https://siggy-pixelverse.lovable.app/"},
      
      // Project ke-33
      {name:"Ritual App Hub", desc:"List of applications built by the Ritual community.", category:"Hub", image:"", link:"https://ritualapphub.vercel.app"}
    ];

    const grid = document.getElementById('project-grid');
    projects.forEach(p => {
      const cardHTML = `
        <div class="project-card bg-zinc-950 border border-zinc-800 rounded-3xl overflow-hidden group">
          <img src="${p.image}" alt="${p.name}">
          <div class="p-5 flex-1 flex flex-col">
            <h3 class="text-lg font-semibold mb-2">${p.name}</h3>
            <p class="text-zinc-400 text-sm leading-tight mb-4 flex-1">${p.desc}</p>
            <span class="inline-block px-3 py-1 text-xs bg-emerald-900 text-emerald-400 rounded-full mb-4">${p.category}</span>
            <a href="${p.link}" target="_blank" class="mt-auto block w-full py-3 text-center border border-emerald-500 hover:bg-emerald-500 hover:text-black rounded-2xl text-sm font-medium transition">
              Launch Project →
            </a>
          </div>
        </div>
      `;
      grid.innerHTML += cardHTML;
    });

    // Navigasi
    const scrollContainer = document.getElementById('project-grid');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    prevBtn.addEventListener('click', () => scrollContainer.scrollBy({ left: -840, behavior: 'smooth' }));
    nextBtn.addEventListener('click', () => scrollContainer.scrollBy({ left: 840, behavior: 'smooth' }));

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') prevBtn.click();
      if (e.key === 'ArrowRight') nextBtn.click();
    });
  </script>
</body>
</html>
